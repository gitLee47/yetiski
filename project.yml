name: YetiSki
options:
  bundleIdPrefix: com.lijulee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  YetiSki:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YetiSki
    resources:
      - path: YetiSki/Assets.xcassets
      - path: YetiSki/Resources
    info:
      path: YetiSki/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleDisplayName: YetiSki
        GKGameCenterLeaderboardsKey: best_distance
    entitlements:
      path: YetiSki/YetiSki.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lijulee.yetiski
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  YetiSki:
    build:
      targets:
        YetiSki: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
