    entitlements:
      path: YetiSki/YetiSki.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lijulee.yetiski
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  YetiSki:
    build:
      targets:
        YetiSki: all
    run:
      config: Debug
      # Local StoreKit test catalog — no App Store Connect products needed
      # to build/test real purchases. Remove this line before a Release/
      # TestFlight archive so real sandbox/production App Store is used.
      storeKitConfiguration: YetiSki/Products.storekit
    test:
      config: Debug
    archive:
      config: Release
